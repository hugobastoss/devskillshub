name: Validar catálogo

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validar-itens.mjs'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/validar-itens.mjs'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validar-itens.mjs
